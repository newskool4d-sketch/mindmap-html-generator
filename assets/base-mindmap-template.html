<!DOCTYPE html>
<html lang="ko" data-subject="{{SUBJECT}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    :root {
      --bg: #f5f8f6;
      --panel: rgba(255, 255, 255, 0.86);
      --text: #24322d;
      --muted: #5c6d66;
      --line: #b8cac1;
      --center1: #8eb8aa;
      --center2: #6d978b;
      --card1: #fce4e7;
      --card2: #fde9d5;
      --card3: #f5f0d5;
      --card4: #e3f0dc;
      --card5: #d8eeec;
      --card6: #ddeaf8;
      --card7: #ece7f5;
      --card8: #f5e3f0;
      --shadow: 0 14px 30px rgba(56, 72, 66, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
      color: var(--text);
      word-break: keep-all;
      overflow-wrap: normal;
      background:
        radial-gradient(circle at 12% 12%, #edf4ef 0, transparent 26%),
        radial-gradient(circle at 88% 88%, #eef3f6 0, transparent 24%),
        var(--bg);
    }

    .wrap {
      max-width: 1500px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .desc {
      text-align: center;
      color: var(--muted);
      margin: 10px 0 24px;
      line-height: 1.65;
      font-size: 16px;
      font-weight: 700;
      word-break: keep-all;
      overflow-wrap: normal;
    }

    .map {
      position: relative;
      min-height: 1180px;
      border-radius: 30px;
      background: var(--panel);
      box-shadow: 0 18px 40px rgba(75, 93, 86, 0.08);
      overflow: hidden;
      backdrop-filter: blur(6px);
    }

    .lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .line {
      stroke: var(--line);
      stroke-width: 4;
      fill: none;
      stroke-linecap: round;
      opacity: 0.95;
    }

    .node {
      position: absolute;
      z-index: 1;
      width: 260px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.9);
      background: white;
    }

    .node button {
      width: 100%;
      border: none;
      background: transparent;
      padding: 16px 18px;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }

    .node-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 700;
    }

    .node-sub {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      font-weight: 700;
      word-break: keep-all;
      overflow-wrap: normal;
    }

    .icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.7);
      color: #4c6259;
      font-size: 18px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, padding 0.35s ease;
      padding: 0 18px;
    }

    .node.active .content {
      padding: 0 18px 18px;
    }

    .content ul {
      margin: 0;
      padding-left: 18px;
      line-height: 1.75;
      font-size: 15px;
      font-weight: 700;
      word-break: keep-all;
      overflow-wrap: normal;
    }

    .center {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, var(--center1), var(--center2));
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px;
      border: none;
      box-shadow: 0 18px 38px rgba(89, 120, 109, 0.20);
    }

    .center-inner h2 {
      margin: 0 0 12px;
      font-size: 38px;
      font-weight: 700;
    }

    .center-inner p {
      margin: 0;
      line-height: 1.65;
      font-size: 18px;
      font-weight: 700;
      word-break: keep-all;
      overflow-wrap: normal;
    }

    .branch-1 { background: var(--card1); }
    .branch-2 { background: var(--card2); }
    .branch-3 { background: var(--card3); }
    .branch-4 { background: var(--card4); }
    .branch-5 { background: var(--card5); }
    .branch-6 { background: var(--card6); }
    .branch-7 { background: var(--card7); }
    .branch-8 { background: var(--card8); }

    .hint {
      text-align: center;
      color: var(--muted);
      margin-top: 16px;
      font-size: 14px;
      font-weight: 700;
      word-break: keep-all;
      overflow-wrap: normal;
    }

    /* ── 교과별 테마 ── */
    [data-subject="국어"] {
      --bg:#fdf7f0; --center1:#c8956c; --center2:#a5714a; --line:#ddb99a;
      --card1:#fce8d8; --card2:#f9dfc8; --card3:#f7e8c0; --card4:#f4f0e0;
      --card5:#ede8d8; --card6:#e8e0d0; --card7:#f0e0c8; --card8:#f5e8d8;
    }
    [data-subject="수학"] {
      --bg:#f0f4fa; --center1:#6b8fc7; --center2:#4a6fa5; --line:#a8bfd8;
      --card1:#dce8f8; --card2:#cde0f5; --card3:#d8e8f8; --card4:#e0eefc;
      --card5:#d0e4f8; --card6:#c8dcf4; --card7:#d4e4f8; --card8:#dceaf8;
    }
    [data-subject="과학"] {
      --bg:#f0faf4; --center1:#5aac7a; --center2:#3d8a5e; --line:#9ed4b4;
      --card1:#d8f0e4; --card2:#d0ecd8; --card3:#d8f4e0; --card4:#e0f8e8;
      --card5:#d4f0dc; --card6:#cce8d4; --card7:#d8f0e0; --card8:#dcf0e4;
    }
    [data-subject="사회"] {
      --bg:#faf4ed; --center1:#d4895a; --center2:#b06840; --line:#e0b898;
      --card1:#fce0c8; --card2:#f8d8b8; --card3:#f5e0c0; --card4:#f8e8d0;
      --card5:#f4dcc0; --card6:#f0d4b8; --card7:#f5dcc8; --card8:#f8e4d0;
    }
    [data-subject="영어"] {
      --bg:#f2f0f8; --center1:#7b6fbc; --center2:#5d539c; --line:#b4aed8;
      --card1:#e4e0f4; --card2:#ddd8f0; --card3:#e4dff0; --card4:#eae8f8;
      --card5:#e0daf4; --card6:#d8d0f0; --card7:#dcd8f4; --card8:#e2def8;
    }
    [data-subject="미술"] {
      --bg:#fdf5f8; --center1:#d4709a; --center2:#b04f7a; --line:#e8a8c0;
      --card1:#fce4ec; --card2:#fcdce8; --card3:#fce0f0; --card4:#f8e4f4;
      --card5:#f4dcea; --card6:#f0d8e8; --card7:#f4dcec; --card8:#f8e0f0;
    }
    [data-subject="음악"] {
      --bg:#f4f0fa; --center1:#9370b8; --center2:#7050a0; --line:#c0a8d8;
      --card1:#ecdce8; --card2:#e8d8f4; --card3:#ecd8f8; --card4:#f0dcf8;
      --card5:#e8d4f4; --card6:#e0ccec; --card7:#e8d8f0; --card8:#ecdef8;
    }
    [data-subject="체육"] {
      --bg:#fdf4f0; --center1:#e06040; --center2:#c04030; --line:#e8a898;
      --card1:#fce0d8; --card2:#fad4c8; --card3:#fcdcc0; --card4:#fce4c8;
      --card5:#f8d8c0; --card6:#f4ccb8; --card7:#f8d8c4; --card8:#fcdcc8;
    }
    [data-subject="역사"] {
      --bg:#f8f4ec; --center1:#9a8060; --center2:#786048; --line:#c8b898;
      --card1:#f0e4cc; --card2:#ecdcc0; --card3:#f0e4c8; --card4:#f4e8cc;
      --card5:#eee0c0; --card6:#e8d8b8; --card7:#eee0c4; --card8:#f0e4c8;
    }
    [data-subject="도덕"] {
      --bg:#f0f8f4; --center1:#6aab88; --center2:#4a8a68; --line:#a8cdb8;
      --card1:#dcf0e4; --card2:#d4ecdc; --card3:#daf0e4; --card4:#e0f4e8;
      --card5:#d8eee0; --card6:#d0e8d8; --card7:#d8f0e0; --card8:#dcf0e4;
    }

    @media (max-width: 1200px) {
      .map {
        min-height: auto;
        padding: 20px;
      }

      .lines {
        display: none;
      }

      .node,
      .center {
        position: static;
        width: 100%;
        height: auto;
        transform: none;
        border-radius: 24px;
        margin-bottom: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>{{TITLE}}</h1>
    <p class="desc">{{DESCRIPTION}}</p>

    <div class="map">
      <svg class="lines" preserveAspectRatio="none"></svg>

      <div class="node center">
        <div class="center-inner">
          <h2>{{CENTER_TITLE}}</h2>
          <p>{{CENTER_TEXT}}</p>
        </div>
      </div>

      {{BRANCHES}}
    </div>

    <p class="hint">{{HINT}}</p>
  </div>

  <script>
    const map = document.querySelector(".map");
    const lineSvg = document.querySelector(".lines");
    const centerNode = document.querySelector(".center");
    const nodes = Array.from(document.querySelectorAll(".node:not(.center)"));
    let rafId = null;

    function syncExpandedHeights() {
      nodes.forEach((node) => {
        const content = node.querySelector(".content");
        if (!content) return;
        if (node.classList.contains("active")) {
          content.style.maxHeight = `${content.scrollHeight}px`;
        } else {
          content.style.maxHeight = "0px";
        }
      });
    }

    function drawConnections() {
      if (window.innerWidth <= 1200) {
        lineSvg.innerHTML = "";
        return;
      }

      const mapRect = map.getBoundingClientRect();
      const centerRect = centerNode.getBoundingClientRect();

      const centerX = centerRect.left - mapRect.left + centerRect.width / 2;
      const centerY = centerRect.top - mapRect.top + centerRect.height / 2;
      const centerRadiusX = centerRect.width / 2;
      const centerRadiusY = centerRect.height / 2;

      lineSvg.setAttribute("viewBox", `0 0 ${Math.round(mapRect.width)} ${Math.round(mapRect.height)}`);
      lineSvg.innerHTML = "";

      nodes.forEach((node) => {
        const rect = node.getBoundingClientRect();
        const nodeCenterX = rect.left - mapRect.left + rect.width / 2;
        const nodeCenterY = rect.top - mapRect.top + rect.height / 2;
        const isLeftSide = nodeCenterX < centerX;

        const dx = nodeCenterX - centerX;
        const dy = nodeCenterY - centerY;
        const centerScale = 1 / Math.sqrt(
          (dx * dx) / (centerRadiusX * centerRadiusX) +
          (dy * dy) / (centerRadiusY * centerRadiusY)
        );

        const startX = centerX + dx * centerScale;
        const startY = centerY + dy * centerScale;

        const halfW = rect.width / 2;
        const halfH = rect.height / 2;
        const nodeScale = 1 / Math.max(Math.abs(dx) / halfW, Math.abs(dy) / halfH);
        const endX = nodeCenterX - dx * nodeScale;
        const endY = nodeCenterY - dy * nodeScale;

        const curveOffset = Math.max(50, Math.abs(endX - startX) * 0.22);
        const control1X = isLeftSide ? startX - curveOffset : startX + curveOffset;
        const control2X = isLeftSide ? endX + curveOffset : endX - curveOffset;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", "line");
        path.setAttribute(
          "d",
          `M ${startX} ${startY} C ${control1X} ${startY}, ${control2X} ${endY}, ${endX} ${endY}`
        );
        lineSvg.appendChild(path);
      });
    }

    function layoutDesktopNodes() {
      if (window.innerWidth <= 1200) {
        nodes.forEach((node) => {
          node.style.top = "";
          node.style.left = "";
          node.style.right = "";
        });
        map.style.minHeight = "";
        return;
      }

      const leftNodes = Array.from(document.querySelectorAll('[data-connect="left"]'));
      const rightNodes = Array.from(document.querySelectorAll('[data-connect="right"]'));
      const topGap = 90;
      const middleGap = 54;
      const bottomPadding = 70;
      const leftOffsets = [90, 40, 110, 60];
      const rightOffsets = [90, 40, 110, 60];

      function placeColumn(columnNodes, side) {
        let currentTop = topGap;

        columnNodes.forEach((node, index) => {
          const offset = side === "left"
            ? leftOffsets[index % leftOffsets.length]
            : rightOffsets[index % rightOffsets.length];

          if (index > 0) currentTop += middleGap;
          node.style.top = `${currentTop}px`;
          if (side === "left") {
            node.style.left = `${offset}px`;
            node.style.right = "";
          } else {
            node.style.right = `${offset}px`;
            node.style.left = "";
          }
          currentTop += node.offsetHeight;
        });

        return currentTop;
      }

      const leftBottom = leftNodes.length ? placeColumn(leftNodes, "left") : 0;
      const rightBottom = rightNodes.length ? placeColumn(rightNodes, "right") : 0;
      const centerBottom = centerNode.offsetTop + centerNode.offsetHeight + bottomPadding;
      const contentBottom = Math.max(leftBottom, rightBottom) + bottomPadding;
      const requiredHeight = Math.max(1180, centerBottom, contentBottom);

      map.style.minHeight = `${requiredHeight}px`;
    }

    function refreshLayout() {
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
      }

      rafId = requestAnimationFrame(() => {
        syncExpandedHeights();
        layoutDesktopNodes();
        drawConnections();
        rafId = null;
      });
    }

    nodes.forEach((node) => {
      const button = node.querySelector("button");
      const icon = node.querySelector(".icon");
      const content = node.querySelector(".content");

      button.addEventListener("click", () => {
        const isActive = node.classList.contains("active");
        node.classList.toggle("active");
        icon.textContent = isActive ? "+" : "−";
        refreshLayout();
      });

      if (content) {
        content.addEventListener("transitionrun", refreshLayout);
        content.addEventListener("transitionend", refreshLayout);
      }
    });

    const resizeObserver = new ResizeObserver(() => {
      refreshLayout();
    });

    resizeObserver.observe(map);
    resizeObserver.observe(centerNode);
    nodes.forEach((node) => resizeObserver.observe(node));

    window.addEventListener("load", refreshLayout);
    window.addEventListener("resize", refreshLayout);
  </script>
</body>
</html>
