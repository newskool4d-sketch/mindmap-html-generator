<!DOCTYPE html>
<html lang="ko" data-subject="{{SUBJECT}}" data-mode="{{MODE}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    :root {
      --bg: #f5f8f6;
      --panel: rgba(255, 255, 255, 0.86);
      --text: #24322d;
      --muted: #5c6d66;
      --line: #b8cac1;
      --center1: #8eb8aa;
      --center2: #6d978b;
      --card1: #fce4e7;
      --card2: #fde9d5;
      --card3: #f5f0d5;
      --card4: #e3f0dc;
      --card5: #d8eeec;
      --card6: #ddeaf8;
      --card7: #ece7f5;
      --card8: #f5e3f0;
      --shadow: 0 14px 30px rgba(56, 72, 66, 0.10);
      --surface-canvas: var(--bg);
      --surface-board: var(--panel);
      --surface-panel: #ffffff;
      --surface-wash: rgba(255, 255, 255, 0.52);
      --surface-guide: rgba(92, 109, 102, 0.08);
      --surface-note-1: var(--card1);
      --surface-note-2: var(--card2);
      --surface-note-3: var(--card3);
      --surface-note-4: var(--card4);
      --surface-note-5: var(--card5);
      --surface-note-6: var(--card6);
      --surface-note-7: var(--card7);
      --surface-note-8: var(--card8);
      --text-primary: var(--text);
      --text-secondary: var(--muted);
      --border-subtle: rgba(92, 109, 102, 0.22);
      --border-on-note: rgba(255, 255, 255, 0.9);
      --border-active: rgba(92, 109, 102, 0.38);
      --surface-control: rgba(255, 255, 255, 0.70);
      --surface-control-hover: rgba(255, 255, 255, 0.92);
      --line-connector: var(--line);
      --focus-ring: var(--center2);
      --radius-board: 30px;
      --radius-node: 24px;
      --radius-panel: 18px;
      --radius-quiz: 14px;
      --radius-pill: 999px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-7: 28px;
      --space-8: 32px;
      --space-10: 40px;
      --shadow-rest: var(--shadow);
      --shadow-board: 0 18px 40px rgba(75, 93, 86, 0.08);
      --shadow-panel: 0 10px 24px rgba(56, 72, 66, 0.06);
      --shadow-focus: 0 18px 38px rgba(89, 120, 109, 0.20);
      --motion-expand: max-height 0.35s ease, padding 0.35s ease;
      --motion-control: background-color 0.16s ease-out, border-color 0.16s ease-out, box-shadow 0.16s ease-out, color 0.16s ease-out, filter 0.16s ease-out, transform 0.16s ease-out;
      --shadow-note-rest: 0 1px 2px rgba(56, 72, 66, 0.10), 0 10px 18px rgba(56, 72, 66, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.65);
      --shadow-note-raised: 0 2px 4px rgba(56, 72, 66, 0.12), 0 18px 30px rgba(56, 72, 66, 0.17), inset 0 1px 0 rgba(255, 255, 255, 0.65);
      --shadow-note-pressed: inset 0 2px 5px rgba(56, 72, 66, 0.16);
      --paper-sheen: linear-gradient(180deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0) 46%);
      --surface-tape: rgba(255, 255, 255, 0.5);
      --border-tape: rgba(255, 255, 255, 0.68);
      --surface-frame: #eef1ef;
      --border-frame: rgba(92, 109, 102, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Malgun Gothic", "맑은 고딕", system-ui, -apple-system, sans-serif;
      color: var(--text-primary);
      /* Korean phrases stay together, while long tokens still wrap safely. */
      word-break: keep-all;
      overflow-wrap: anywhere;
      overflow-x: hidden;
      background:
        linear-gradient(180deg, var(--surface-wash), transparent 38%),
        var(--surface-canvas);
    }

    .wrap {
      max-width: 1500px;
      margin: 0 auto;
      padding: var(--space-8) var(--space-5) var(--space-5);
    }

    .page-head {
      max-width: 980px;
      margin: 0 auto var(--space-6);
      text-align: left;
    }

    .mode-label {
      margin: 0 0 var(--space-2);
      color: var(--focus-ring);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.22;
      text-wrap: balance;
    }

    .desc {
      color: var(--text-secondary);
      margin: var(--space-3) 0 0;
      line-height: 1.65;
      font-size: 16px;
      font-weight: 700;
      text-wrap: pretty;
    }

    .map {
      position: relative;
      min-height: 1180px;
      border-radius: var(--radius-board);
      border: 1px solid var(--border-subtle);
      background:
        linear-gradient(var(--surface-board), var(--surface-board)),
        repeating-linear-gradient(0deg, transparent 0 39px, var(--surface-guide) 39px 40px),
        repeating-linear-gradient(90deg, transparent 0 39px, var(--surface-guide) 39px 40px);
      box-shadow: var(--shadow-board), inset 0 0 0 10px var(--surface-frame), 0 0 0 1px var(--border-frame);
      overflow: hidden;
      isolation: isolate;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .line {
      stroke: var(--line-connector);
      stroke-width: 3.5;
      fill: none;
      stroke-linecap: round;
      opacity: 0.86;
    }

    .node {
      position: absolute;
      z-index: 1;
      width: 260px;
      border-radius: var(--radius-node);
      overflow: visible;
      box-shadow: var(--shadow-note-rest);
      border: 1px solid var(--border-on-note);
      background: var(--surface-panel);
      background-image: var(--paper-sheen);
      transition: var(--motion-control);
    }

    .node:not(.center):hover,
    .node.active {
      border-color: var(--border-active);
      box-shadow: var(--shadow-note-raised);
    }

    .node > button {
      width: 100%;
      border: none;
      background: transparent;
      padding: var(--space-4) 18px;
      text-align: left;
      font: inherit;
      cursor: pointer;
      min-height: 48px;
      border-radius: calc(var(--radius-node) - 1px);
      transition: var(--motion-control);
    }

    .node.active > button {
      border-radius: calc(var(--radius-node) - 1px) calc(var(--radius-node) - 1px) 0 0;
    }

    .node > button:hover,
    .node > button[aria-expanded="true"] {
      background: var(--surface-control);
    }

    .node > button:active {
      transform: translateY(1px);
      box-shadow: var(--shadow-note-pressed);
    }

    .node > button:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: -3px;
      border-radius: var(--radius-node);
    }

    .node-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 700;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .node-sub {
      margin-top: 8px;
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.5;
      font-weight: 700;
    }

    .icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-control);
      color: var(--text-secondary);
      font-size: 18px;
      font-weight: 700;
      flex-shrink: 0;
      transition: var(--motion-control);
    }

    .node > button:hover .icon,
    .node > button[aria-expanded="true"] .icon {
      background: var(--focus-ring);
      color: white;
    }

    .content {
      max-height: 0;
      overflow: hidden;
      transition: var(--motion-expand);
      padding: 0 18px;
    }

    .node.active .content {
      padding: 0 18px 18px;
      border-top: 1px solid var(--border-subtle);
    }

    .content ul {
      margin: 0;
      padding-left: 18px;
      line-height: 1.75;
      font-size: 15px;
      font-weight: 700;
    }

    .content li + li,
    .pedagogy-list li + li {
      margin-top: var(--space-1);
    }

    .center {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, var(--center1), var(--center2));
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-7);
      border: 6px solid rgba(255, 255, 255, 0.78);
      box-shadow: var(--shadow-focus), inset 0 2px 0 rgba(255, 255, 255, 0.4), inset 0 -12px 26px rgba(36, 50, 45, 0.16);
    }

    .center-inner h2 {
      margin: 0 0 12px;
      font-size: 38px;
      font-weight: 700;
    }

    .center-inner p {
      margin: 0;
      line-height: 1.65;
      font-size: 18px;
      font-weight: 700;
    }

    .branch-1 { background-color: var(--surface-note-1); }
    .branch-2 { background-color: var(--surface-note-2); }
    .branch-3 { background-color: var(--surface-note-3); }
    .branch-4 { background-color: var(--surface-note-4); }
    .branch-5 { background-color: var(--surface-note-5); }
    .branch-6 { background-color: var(--surface-note-6); }
    .branch-7 { background-color: var(--surface-note-7); }
    .branch-8 { background-color: var(--surface-note-8); }

    .node:not(.center)::after {
      content: "";
      position: absolute;
      top: -9px;
      left: 50%;
      width: 76px;
      height: 22px;
      transform: translateX(-50%) rotate(-2.5deg);
      background: var(--surface-tape);
      border: 1px solid var(--border-tape);
      border-radius: 2px;
      box-shadow: 0 1px 2px rgba(56, 72, 66, 0.12);
      pointer-events: none;
      z-index: 2;
    }

    .hint {
      text-align: center;
      color: var(--text-secondary);
      margin-top: var(--space-4);
      font-size: 14px;
      font-weight: 700;
    }

    /* ── 퀴즈 블록 (퀴즈형 모드에서 브랜치 content 내부에 사용) ── */
    .quiz {
      margin-top: var(--space-3);
      padding: var(--space-3) 14px;
      border-radius: var(--radius-quiz);
      background: rgba(255, 255, 255, 0.65);
    }

    .quiz-q {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 700;
    }

    .quiz-toggle {
      border: none;
      border-radius: var(--radius-pill);
      padding: 6px 14px;
      background: var(--focus-ring);
      color: white;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      min-height: 40px;
      transition: var(--motion-control);
    }

    .quiz-toggle:hover,
    .quiz-toggle[aria-expanded="true"] {
      filter: saturate(1.04) brightness(0.96);
    }

    .quiz-toggle:active {
      transform: translateY(1px);
    }

    .quiz-toggle:focus-visible {
      outline: 3px solid var(--text-primary);
      outline-offset: 2px;
    }

    .quiz-a {
      margin: 10px 0 0;
      font-size: 15px;
      font-weight: 700;
      color: var(--focus-ring);
    }

    .quiz-a:not(.hidden) {
      padding: var(--space-2) var(--space-3);
      border-left: 3px solid var(--focus-ring);
      border-radius: 10px;
      background: var(--surface-control);
      color: var(--text-primary);
    }

    .hidden {
      display: none;
    }

    .pedagogy {
      max-width: 1040px;
      margin: 0 auto var(--space-6);
      padding: 14px var(--space-4);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-panel);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: var(--shadow-panel);
    }

    .pedagogy h2 {
      margin: 0 0 var(--space-2);
      font-size: 16px;
      letter-spacing: 0;
    }

    .pedagogy-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-2) var(--space-4);
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .pedagogy-item {
      display: grid;
      gap: 4px;
      min-width: 0;
      line-height: 1.55;
      font-size: 14px;
    }

    .pedagogy-item strong {
      color: var(--focus-ring);
      font-size: 13px;
    }

    .pedagogy-list {
      margin: 0;
      padding-left: 18px;
    }

    /* ── 모드: 발표용 (큰 글씨·넓은 여백·강한 대비) ── */
    [data-mode="발표용"] {
      --text: #1c2925;
    }
    [data-mode="발표용"] h1 { font-size: 42px; }
    [data-mode="발표용"] .desc { font-size: 18px; }
    [data-mode="발표용"] .center { width: 380px; height: 380px; }
    [data-mode="발표용"] .center-inner h2 { font-size: 46px; }
    [data-mode="발표용"] .center-inner p { font-size: 20px; }
    [data-mode="발표용"] .node { width: 280px; }
    [data-mode="발표용"] .node-title { font-size: 23px; }
    [data-mode="발표용"] .node-sub { font-size: 16px; }
    [data-mode="발표용"] .content ul { font-size: 16px; line-height: 1.8; }

    /* ── 교과별 테마 (html 태그의 data-subject 속성에만 적용) ── */
    [data-subject="국어"] {
      --bg:#fdf7f0; --center1:#c8956c; --center2:#a5714a; --line:#ddb99a;
    }
    [data-subject="수학"] {
      --bg:#f0f4fa; --center1:#6b8fc7; --center2:#4a6fa5; --line:#a8bfd8;
    }
    [data-subject="과학"] {
      --bg:#f0faf4; --center1:#5aac7a; --center2:#3d8a5e; --line:#9ed4b4;
    }
    [data-subject="사회"] {
      --bg:#faf4ed; --center1:#d4895a; --center2:#b06840; --line:#e0b898;
    }
    [data-subject="영어"] {
      --bg:#f2f0f8; --center1:#7b6fbc; --center2:#5d539c; --line:#b4aed8;
    }
    [data-subject="미술"] {
      --bg:#fdf5f8; --center1:#d4709a; --center2:#b04f7a; --line:#e8a8c0;
    }
    [data-subject="음악"] {
      --bg:#f4f0fa; --center1:#9370b8; --center2:#7050a0; --line:#c0a8d8;
    }
    [data-subject="체육"] {
      --bg:#fdf4f0; --center1:#e06040; --center2:#c04030; --line:#e8a898;
    }
    [data-subject="역사"] {
      --bg:#f8f4ec; --center1:#9a8060; --center2:#786048; --line:#c8b898;
    }
    [data-subject="도덕"] {
      --bg:#f0f8f4; --center1:#6aab88; --center2:#4a8a68; --line:#a8cdb8;
    }
    [data-subject="정보"] {
      --bg:#eff6f8; --center1:#4f9cad; --center2:#377d8e; --line:#9ac8d4;
    }
    [data-subject="실과"] {
      --bg:#f5f7ee; --center1:#8ba35c; --center2:#6b8342; --line:#becf9c;
    }
    [data-subject="진로"] {
      --bg:#faf6ec; --center1:#c0a050; --center2:#9c7e34; --line:#dcc890;
    }

    /* Desktop: full spatial map with SVG connectors. */
    @media (min-width: 1201px) {
      .map {
        min-height: 1180px;
      }

      .node:not(.center) { transform: rotate(-0.45deg); }
      .node.branch-2, .node.branch-5, .node.branch-8 { transform: rotate(0.5deg); }
      .node.branch-3, .node.branch-6 { transform: rotate(-0.2deg); }
      .node:not(.center):hover, .node.active { transform: rotate(0deg); }
    }

    /* Tablet and small classroom displays: stack cards, hide decorative connectors. */
    @media (max-width: 1200px) {
      .wrap {
        padding: 14px;
      }

      .page-head {
        margin-bottom: var(--space-4);
      }

      .pedagogy-grid {
        grid-template-columns: 1fr;
      }

      .map {
        min-height: auto;
        padding: 20px;
      }

      .lines {
        display: none;
      }

      .node,
      .center {
        position: relative;
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
        transform: none;
        border-radius: 24px;
        margin-bottom: 16px;
      }

      [data-mode="발표용"] .node,
      [data-mode="발표용"] .center {
        width: 100%;
      }
    }

    /* Mobile: tighten the whiteboard while preserving full text. */
    @media (max-width: 768px) {
      .wrap {
        padding: var(--space-3);
      }

      h1 {
        font-size: 30px;
      }

      .desc {
        font-size: 15px;
      }

      .map {
        padding: var(--space-4);
        border-radius: 22px;
      }

      .pedagogy {
        padding: var(--space-3);
      }

      .center {
        padding: var(--space-6);
      }

      .center-inner h2 {
        font-size: 34px;
      }

      .center-inner p {
        font-size: 17px;
      }
    }

    /* Narrow mobile: keep every card inside the viewport without font viewport scaling. */
    @media (max-width: 430px) {
      .wrap {
        padding: 10px;
      }

      .page-head {
        margin-bottom: var(--space-3);
      }

      .mode-label {
        font-size: 13px;
      }

      h1 {
        font-size: 28px;
      }

      .map {
        padding: var(--space-3);
        border-radius: 18px;
      }

      .node,
      .center {
        border-radius: 18px;
        margin-bottom: var(--space-3);
      }

      .node > button {
        padding: var(--space-3);
      }

      .node-title {
        font-size: 19px;
      }

      .node-sub,
      .content ul,
      .quiz-q,
      .quiz-a {
        font-size: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .content {
        transition: none;
      }
    }

    /* Print: expand learning content, suppress only interactive controls. */
    @media print {
      @page { margin: 12mm; }
      body { background: white; }
      .wrap { max-width: none; padding: 0; }
      .page-head { margin-bottom: 12px; }
      .pedagogy { box-shadow: none; break-inside: avoid; }
      .pedagogy-grid { display: block; }
      .pedagogy-item { margin-bottom: 8px; }
      .map { box-shadow: none; min-height: auto !important; padding: 0; background: white; }
      .lines, .icon, .hint, .quiz-toggle { display: none; }
      .node:not(.center)::after { display: none; }
      .node:not(.center) { transform: none; box-shadow: none; background-image: none; }
      .map { border: 1px solid var(--border-subtle); outline: none; }
      .node, .node.active, .center {
        position: static;
        width: 100%;
        height: auto;
        transform: none;
        border-radius: 16px;
        margin-bottom: 12px;
        box-shadow: none;
        break-inside: avoid;
      }
      .node > button { padding: 12px 14px; pointer-events: none; }
      .content { max-height: none !important; overflow: visible !important; padding: 0 18px 18px; }
      .quiz-a.hidden { display: block; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="page-head" aria-labelledby="page-title">
      <p class="mode-label">{{MODE}}</p>
      <h1 id="page-title">{{TITLE}}</h1>
      <p class="desc">{{DESCRIPTION}}</p>
    </header>

    {{PEDAGOGY}}

    <section class="map" aria-labelledby="map-region-title">
      <h2 id="map-region-title" class="sr-only">마인드맵 영역</h2>
      <svg class="lines" preserveAspectRatio="none" aria-hidden="true"></svg>

      <section class="node center" aria-label="중심 주제">
        <div class="center-inner">
          <h2>{{CENTER_TITLE}}</h2>
          <p>{{CENTER_TEXT}}</p>
        </div>
      </section>

      {{BRANCHES}}
    </section>

    <p class="hint">{{HINT}}</p>
  </main>

  <script>
    const map = document.querySelector(".map");
    const lineSvg = document.querySelector(".lines");
    const centerNode = document.querySelector(".center");
    const nodes = Array.from(document.querySelectorAll(".node:not(.center)"));
    const mode = document.documentElement.dataset.mode || "교과용";
    let rafId = null;

    function syncExpandedHeights() {
      nodes.forEach((node) => {
        const content = node.querySelector(".content");
        if (!content) return;
        if (node.classList.contains("active")) {
          content.style.maxHeight = `${content.scrollHeight}px`;
        } else {
          content.style.maxHeight = "0px";
        }
      });
    }

    function drawConnections() {
      if (window.innerWidth <= 1200) {
        lineSvg.innerHTML = "";
        return;
      }

      const mapRect = map.getBoundingClientRect();
      const centerRect = centerNode.getBoundingClientRect();

      const centerX = centerRect.left - mapRect.left + centerRect.width / 2;
      const centerY = centerRect.top - mapRect.top + centerRect.height / 2;
      const centerRadiusX = centerRect.width / 2;
      const centerRadiusY = centerRect.height / 2;

      lineSvg.setAttribute("viewBox", `0 0 ${Math.round(mapRect.width)} ${Math.round(mapRect.height)}`);
      lineSvg.innerHTML = "";

      nodes.forEach((node) => {
        const rect = node.getBoundingClientRect();
        const nodeCenterX = rect.left - mapRect.left + rect.width / 2;
        const nodeCenterY = rect.top - mapRect.top + rect.height / 2;
        const isLeftSide = nodeCenterX < centerX;

        const dx = nodeCenterX - centerX;
        const dy = nodeCenterY - centerY;
        const centerScale = 1 / Math.sqrt(
          (dx * dx) / (centerRadiusX * centerRadiusX) +
          (dy * dy) / (centerRadiusY * centerRadiusY)
        );

        const startX = centerX + dx * centerScale;
        const startY = centerY + dy * centerScale;

        const halfW = rect.width / 2;
        const halfH = rect.height / 2;
        const nodeScale = 1 / Math.max(Math.abs(dx) / halfW, Math.abs(dy) / halfH);
        const endX = nodeCenterX - dx * nodeScale;
        const endY = nodeCenterY - dy * nodeScale;

        const curveOffset = Math.max(50, Math.abs(endX - startX) * 0.22);
        const control1X = isLeftSide ? startX - curveOffset : startX + curveOffset;
        const control2X = isLeftSide ? endX + curveOffset : endX - curveOffset;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", "line");
        path.setAttribute("vector-effect", "non-scaling-stroke");
        path.setAttribute(
          "d",
          `M ${startX} ${startY} C ${control1X} ${startY}, ${control2X} ${endY}, ${endX} ${endY}`
        );
        lineSvg.appendChild(path);
      });
    }

    function layoutDesktopNodes() {
      if (window.innerWidth <= 1200) {
        nodes.forEach((node) => {
          node.style.top = "";
          node.style.left = "";
          node.style.right = "";
        });
        map.style.minHeight = "";
        return;
      }

      const leftNodes = Array.from(document.querySelectorAll('[data-connect="left"]'));
      const rightNodes = Array.from(document.querySelectorAll('[data-connect="right"]'));
      // 발표용은 여백을 넓혀 화면 공유 시 시인성 확보
      const topGap = mode === "발표용" ? 100 : 90;
      const middleGap = mode === "발표용" ? 80 : 54;
      const bottomPadding = 70;
      const leftOffsets = [90, 40, 110, 60];
      const rightOffsets = [90, 40, 110, 60];

      function placeColumn(columnNodes, side) {
        let currentTop = topGap;

        columnNodes.forEach((node, index) => {
          const offset = side === "left"
            ? leftOffsets[index % leftOffsets.length]
            : rightOffsets[index % rightOffsets.length];

          if (index > 0) currentTop += middleGap;
          node.style.top = `${currentTop}px`;
          if (side === "left") {
            node.style.left = `${offset}px`;
            node.style.right = "";
          } else {
            node.style.right = `${offset}px`;
            node.style.left = "";
          }
          currentTop += node.offsetHeight;
        });

        return currentTop;
      }

      const leftBottom = leftNodes.length ? placeColumn(leftNodes, "left") : 0;
      const rightBottom = rightNodes.length ? placeColumn(rightNodes, "right") : 0;
      const centerBottom = centerNode.offsetTop + centerNode.offsetHeight + bottomPadding;
      const contentBottom = Math.max(leftBottom, rightBottom) + bottomPadding;
      const requiredHeight = Math.max(1180, centerBottom, contentBottom);

      map.style.minHeight = `${requiredHeight}px`;
    }

    function refreshLayout() {
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
      }

      rafId = requestAnimationFrame(() => {
        syncExpandedHeights();
        layoutDesktopNodes();
        drawConnections();
        rafId = null;
      });
    }

    nodes.forEach((node) => {
      const button = node.querySelector("button");
      const icon = node.querySelector(".icon");
      const content = node.querySelector(".content");

      button.setAttribute("aria-expanded", "false");
      if (content) content.setAttribute("aria-hidden", "true");
      button.addEventListener("click", () => {
        const isActive = node.classList.contains("active");
        node.classList.toggle("active");
        button.setAttribute("aria-expanded", String(!isActive));
        button.setAttribute("aria-label", `${button.dataset.label || ""} ${isActive ? "자세히 보기" : "접기"}`.trim());
        if (content) content.setAttribute("aria-hidden", String(isActive));
        icon.textContent = isActive ? "+" : "−";
        refreshLayout();
      });

      if (content) {
        content.addEventListener("transitionrun", refreshLayout);
        content.addEventListener("transitionend", refreshLayout);
      }
    });

    document.querySelectorAll(".quiz-toggle").forEach((toggle) => {
      const answer = toggle.nextElementSibling;
      if (!answer) return;
      toggle.setAttribute("aria-expanded", "false");
      answer.setAttribute("aria-hidden", "true");
      toggle.addEventListener("click", () => {
        const nowHidden = answer.classList.toggle("hidden");
        toggle.textContent = nowHidden ? "정답 보기" : "정답 닫기";
        toggle.setAttribute("aria-expanded", String(!nowHidden));
        toggle.setAttribute("aria-label", `${toggle.dataset.label || ""} ${nowHidden ? "정답 보기" : "정답 닫기"}`.trim());
        answer.setAttribute("aria-hidden", String(nowHidden));
        refreshLayout();
      });
    });

    const resizeObserver = new ResizeObserver(() => {
      refreshLayout();
    });

    resizeObserver.observe(map);
    resizeObserver.observe(centerNode);
    nodes.forEach((node) => resizeObserver.observe(node));

    window.addEventListener("load", refreshLayout);
    window.addEventListener("resize", refreshLayout);
  </script>
</body>
</html>
