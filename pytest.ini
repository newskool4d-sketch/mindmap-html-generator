[pytest]
# .codegraph 는 제거된 omo 코드그래프를 가리키는 끊어진 junction — 수집 시 FileNotFoundError 로
# `pytest tests` 전체가 중단되므로 탐색에서 제외한다 (tests/ 만 수집).
testpaths = tests
# norecursedirs 만으로는 부족 — pytest 8 의 rootdir 탐색(samefile)이 junction 에서 먼저 터지므로 --ignore 가 필요
addopts = --ignore=.codegraph
norecursedirs = .codegraph .git .omo .superpowers .agents .claude adapters assets references node_modules
